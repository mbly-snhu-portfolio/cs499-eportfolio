<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS 499 ePortfolio | Grazioso Salvare Dashboard</title>
    <script>
      // Mantine: preserve user/system color scheme before React loads.
      // Uses localStorage key 'mantine-color-scheme' when present.
      try {
        const saved = localStorage.getItem('mantine-color-scheme');
        const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const scheme = saved === 'light' || saved === 'dark' ? saved : (systemDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
      } catch (e) {
        // no-op
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
