name: CI/CD Pipeline

on:
  push:
    branches: [ main, enhancement-one ]
  pull_request:
    branches: [ main, enhancement-one ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync
      
      - name: Run tests
        working-directory: backend
        env:
          MONGODB_HOST: localhost
          MONGODB_PORT: 27017
          MONGO_USER: aacuser
          MONGO_PASS: SECRET
          AAC_DATABASE: aac_test
          SECRET_KEY: test-secret-key
        run: |
          uv run pytest tests/ -v --cov=app --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Enable Corepack
        run: corepack enable
      
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      
      - name: Run linter
        working-directory: frontend
        run: yarn lint || true
      
      - name: Run tests
        working-directory: frontend
        run: yarn test --coverage --watchAll=false || true
      
      - name: Build
        working-directory: frontend
        run: yarn build

  build:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: grazioso-backend:latest
          cache-from: type=registry,ref=grazioso-backend:latest
          cache-to: type=inline
      
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: grazioso-frontend:latest
          cache-from: type=registry,ref=grazioso-frontend:latest
          cache-to: type=inline

