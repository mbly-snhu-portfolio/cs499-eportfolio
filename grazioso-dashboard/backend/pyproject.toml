[project]
name = "grazioso-backend"
version = "1.0.0"
description = "Grazioso Salvare Animal Shelter API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "pymongo>=4.10.0",
    "python-dotenv>=1.0.1",
    "slowapi>=0.1.9",
    "email-validator>=2.2.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "redis>=5.0.0",
    "python-Levenshtein>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Note: Use dependency-groups for dev dependencies in future versions

